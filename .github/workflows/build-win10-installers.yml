name: Build Plugin (x86 & x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x64, x86 ]
    defaults:
      run:
        shell: pwsh
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar repo (debug)
        run: |
          Write-Host "PWD: $(Get-Location)"
          Get-ChildItem -Recurse | Select-Object FullName

      # === Opción C: traer fuentes DejaVu con fallback robusto ===
      - name: Descargar fuentes DejaVu (para bundling e instalador)
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          New-Item -ItemType Directory -Force -Path ".\fonts\DejaVuSans" | Out-Null

          function Download-WithFallback {
            param(
              [Parameter(Mandatory=$true)] [string[]] $Urls,
              [Parameter(Mandatory=$true)] [string]   $OutFile
            )
            $headers = @{ "User-Agent" = "curl/7.79 (GitHub Actions)" }
            foreach ($u in $Urls) {
              try {
                Write-Host "Descargando: $u"
                Invoke-WebRequest -Uri $u -OutFile $OutFile -UseBasicParsing -Headers $headers
                if ((Test-Path $OutFile) -and ((Get-Item $OutFile).Length -ge 10000)) {
                  return
                } else {
                  Write-Warning "Archivo pequeño o vacío desde $u, probando siguiente fallback..."
                }
              } catch {
                Write-Warning "Fallo descarga $u: $($_.Exception.Message). Intentando siguiente..."
              }
            }
            throw "No se pudo descargar $OutFile desde ninguno de los mirrors."
          }

          # Rutas candidatas (master primero, luego tag version_2_37)
          $candsSans = @(
            "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/master/ttf/DejaVuSans.ttf",
            "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/version_2_37/ttf/DejaVuSans.ttf"
          )
          $candsMono = @(
            "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/master/ttf/DejaVuSansMono.ttf",
            "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/version_2_37/ttf/DejaVuSansMono.ttf"
          )

          Download-WithFallback -Urls $candsSans -OutFile ".\fonts\DejaVuSans\DejaVuSans.ttf"
          Download-WithFallback -Urls $candsMono -OutFile ".\fonts\DejaVuSans\DejaVuSansMono.ttf"

          Get-ChildItem ".\fonts\DejaVuSans" | Select-Object Name,Length

      - name: Verificar entry script/spec
        run: |
          if (!(Test-Path ".\Plugin.py"))   { Write-Error ".\Plugin.py no está en $(Get-Location)." }
          if (!(Test-Path ".\Plugin.spec")) { Write-Error ".\Plugin.spec no está en $(Get-Location)." }
          if (!(Test-Path ".\installer.iss")) { Write-Error ".\installer.iss no está en $(Get-Location)." }

      - name: Setup Python (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: ${{ matrix.arch }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.10.0 pywin32 flask flask-cors

      - name: Build con PyInstaller (usa SPEC)
        run: |
          if (Test-Path ".\build") { Remove-Item .\build -Recurse -Force }
          if (Test-Path ".\dist")  { Remove-Item .\dist  -Recurse -Force }

          # Usa SPEC para incluir fonts (datas) y hiddenimports
          pyinstaller --clean --noconfirm Plugin.spec

          if (!(Test-Path ".\dist\Plugin\Plugin.exe")) {
            Write-Error "No se generó .\dist\Plugin\Plugin.exe"
          }

          New-Item -ItemType Directory -Force -Path ".\dist\${{ matrix.arch }}" | Out-Null
          Move-Item ".\dist\Plugin" ".\dist\${{ matrix.arch }}\" -Force

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (${{ matrix.arch }})
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyArch=${{ matrix.arch }} installer.iss

      - name: Mostrar outputs (debug)
        run: |
          Write-Host "Contenido de dist y Output"
          Get-ChildItem -Recurse .\dist | Select-Object FullName, Length
          if (Test-Path .\Output) { Get-ChildItem -Recurse .\Output | Select FullName, Length }

      - name: Publicar artefactos (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ matrix.arch }}
          path: |
            dist\${{ matrix.arch }}\Plugin\Plugin.exe
            Output\Setup-FloWin-Plugin-${{ matrix.arch }}.exe
