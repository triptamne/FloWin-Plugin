name: Build Plugin (x86 & x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x64, x86 ]
    defaults:
      run:
        shell: pwsh
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar repo (debug)
        run: |
          Write-Host "PWD: $(Get-Location)"
          Get-ChildItem -Recurse | Select-Object FullName

      # === Normalizar estructura de fuentes ===
      - name: Normalizar carpeta de fuentes a .\fonts\DejaVuSans
        run: |
          $ErrorActionPreference = "Stop"
          $srcRoot = Join-Path $PWD "fonts"
          $dst     = Join-Path $PWD "fonts\DejaVuSans"

          if (!(Test-Path $srcRoot)) {
            Write-Error "No existe la carpeta 'fonts' en la raíz del repo."
          }

          if (!(Test-Path $dst)) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
          }

          # Copiar .ttf que estén directamente en .\fonts\ hacia .\fonts\DejaVuSans\
          $rootTtf = Get-ChildItem -Path $srcRoot -Filter *.ttf -File -ErrorAction SilentlyContinue
          if ($rootTtf) {
            Copy-Item -Path (Join-Path $srcRoot "*.ttf") -Destination $dst -Force
          }

          # Validar que ahora sí haya .ttf en .\fonts\DejaVuSans\
          $ttf = Get-ChildItem -Path $dst -Filter *.ttf -File -ErrorAction SilentlyContinue
          if (!$ttf) {
            Write-Error "No se encontraron .ttf en ${dst}. Coloca tus fuentes en 'fonts' o en 'fonts\\DejaVuSans'."
          }

          Write-Host "Fuentes detectadas en ${dst}:"
          $ttf | Select-Object Name, Length

      - name: Verificar entry script/spec/iss
        run: |
          if (!(Test-Path ".\Plugin.py"))        { Write-Error ".\Plugin.py no está en $(Get-Location)." }
          if (!(Test-Path ".\Plugin.spec"))      { Write-Error ".\Plugin.spec no está en $(Get-Location)." }
          if (!(Test-Path ".\installer.iss"))    { Write-Error ".\installer.iss no está en $(Get-Location)." }
          if (!(Test-Path ".\fonts\DejaVuSans")) { Write-Error "Faltan fuentes: .\fonts\DejaVuSans no existe." }
          $ttf = Get-ChildItem ".\fonts\DejaVuSans" -Filter *.ttf -File -ErrorAction SilentlyContinue
          if (!$ttf) { Write-Error "No se encontraron .ttf en .\fonts\DejaVuSans." }

      - name: Setup Python (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: ${{ matrix.arch }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build con PyInstaller (usa SPEC)
        run: |
          if (Test-Path ".\build") { Remove-Item .\build -Recurse -Force }
          if (Test-Path ".\dist")  { Remove-Item .\dist  -Recurse -Force }

          pyinstaller --clean --noconfirm Plugin.spec

          if (!(Test-Path ".\dist\Plugin\Plugin.exe")) {
            Write-Error "No se generó .\dist\Plugin\Plugin.exe"
          }

          New-Item -ItemType Directory -Force -Path ".\dist\${{ matrix.arch }}" | Out-Null
          Move-Item ".\dist\Plugin" ".\dist\${{ matrix.arch }}\" -Force

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (${{ matrix.arch }})
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyArch=${{ matrix.arch }} installer.iss

      - name: Mostrar outputs (debug)
        run: |
          Write-Host "Contenido de dist y Output"
          Get-ChildItem -Recurse .\dist | Select-Object FullName, Length
          if (Test-Path .\Output) { Get-ChildItem -Recurse .\Output | Select FullName, Length }

      - name: Publicar artefactos (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ matrix.arch }}
          path: |
            dist\${{ matrix.arch }}\Plugin\Plugin.exe
            Output\Setup-FloWin-Plugin-${{ matrix.arch }}.exe
