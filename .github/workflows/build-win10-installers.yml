name: Build Plugin (x86 & x64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x64, x86 ]
    defaults:
      run:
        shell: pwsh
        working-directory: .   # <-- AJUSTA si tu código está en subcarpeta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Listar repo (debug)
        run: |
          Write-Host "PWD: $(Get-Location)"
          Get-ChildItem -Recurse | Select-Object FullName

      - name: Verificar entry script
        run: |
          if (!(Test-Path ".\Plugin.py")) {
            Write-Error ".\Plugin.py no está en $(Get-Location). Ajusta working-directory o rutas."
          } 

      - name: Setup Python (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: ${{ matrix.arch }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.10.0 pywin32 flask flask-cors

      - name: Build con PyInstaller (incluye fonts)
        run: |
          # Limpiar salidas antiguas
          if (Test-Path ".\build") { Remove-Item .\build -Recurse -Force }
          if (Test-Path ".\dist")  { Remove-Item .\dist  -Recurse -Force }

          # Usar SPEC para evitar problemas de rutas y datas
          pyinstaller --clean --noconfirm --name Plugin Plugin.py

          # Mover a carpeta por arquitectura (dist\Plugin\* -> dist\${arch}\Plugin\*)
          New-Item -ItemType Directory -Force -Path ".\dist\${{ matrix.arch }}"
          Move-Item ".\dist\Plugin" ".\dist\${{ matrix.arch }}\" -Force

      - name: Instalar Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (${{ matrix.arch }})
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyArch=${{ matrix.arch }} installer.iss

      - name: Publicar artefactos (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Plugin-${{ matrix.arch }}
          path: |
            dist\${{ matrix.arch }}\Plugin\Plugin.exe
            Output\Setup-FloWin-Plugin-${{ matrix.arch }}.exe
